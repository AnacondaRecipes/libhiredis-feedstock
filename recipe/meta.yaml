{% set name = "libhiredis" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/redis/hiredis/archive/v{{ version }}.tar.gz
  sha256: 25cee4500f359cf5cad3b51ed62059aadfc0939b05150c1f19c7e2829123631c
  patches:
    - patches/hiredis-1.1.0-disable-network-tests.patch

build:
  number: 0

requirements:
  build:
    - patch  # [not win]
    - m2-patch  # [win]
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make  # [unix]
  host:
    - msinttypes r26  # [win]

test:
  commands:
    - ldd ${PREFIX}/lib/libhiredis.so  # [linux]
    - test -f ${PREFIX}/include/hiredis/hiredis.h  # [unix]
    - test -f ${PREFIX}/lib/libhiredis.{{ version }}${SHLIB_EXT}  # [osx]
    - if not exist %PREFIX%\\Library\\include\\hiredis\\hiredis.h exit 1  # [win]

about:
  home: https://github.com/redis/hiredis
  summary: Minimalistic C client for Redis >= 1.2
  license: BSD-3-Clause
  license_family: BSD
  license_file: COPYING
  description: |
    Hiredis is a minimalistic C client library for the Redis database.
    It is minimalistic because it just adds minimal support for the protocol, but at the same time it uses a high level printf-alike API in order
    to make it much higher level than otherwise suggested by its minimal code base and the lack of explicit bindings for every Redis command.
    Apart from supporting sending commands and receiving replies, it comes with a reply parser that is decoupled from the I/O layer. 
    It is a stream parser designed for easy reusability, which can for instance be used in higher level language bindings for efficient reply parsing.
    Hiredis only supports the binary-safe Redis protocol, so you can use it with any Redis version >= 1.2.0.
    The library comes with multiple APIs. There is the synchronous API, the asynchronous API and the reply parsing API.
  dev_url: https://github.com/redis/hiredis
  doc_url: https://github.com/redis/hiredis/blob/master/README.md

extra:
  recipe-maintainers:
    - apmorton
    - sarnold
